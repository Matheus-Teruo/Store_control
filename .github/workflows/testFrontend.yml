name: Test Frontend

on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "backend/**"
      - "db/**"
      - "table_service/**"
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test-frontend:
    runs-on: "ubuntu-latest"
    env:
      VITE_BACKEND_BASE_URL: http://localhost:8080/
      VITE_SYSTEM_VERSION: simple
      VITE_CARD_ID_FIXED: "OrderCardSimple"
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instala dependências yarn
        run: yarn install
        working-directory: frontend

      - name: Executa Lint
        run: yarn lint
        working-directory: frontend

      # - name: Test
      #   run: yarn test
      #   working-directory: frontend
