# ===============================
# SPRING
# ===============================
spring.application.name=store-control
logging.level.com.storecontrol.backend=${LOGGER_APPLICATION_LEVEL:INFO}

spring.output.ansi.enabled=ALWAYS

config.initializer.root.username=${ROOT_USER}
config.initializer.root.password=${ROOT_PASSWORD}
config.initializer.card-id=OrderCardSimple

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# # ===============================
# # SECURITY
# # ===============================
config.spring.security.token.secret=${JWT_TOKEN:defaultSecret}
config.spring.security.issuer=${AUTH_ISSUER:defaultIssuer}
config.spring.cors.accepted.url=${CORS_ACCEPTED_URL:http//localhost}

# ===============================
# JPA / HIBERNATE
# ===============================
# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql=trace

# ===============================
# DATASOURCE - MYSQL
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/store-control-dev}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD}

# ===============================
# S3
# ===============================
aws.s3.enabled=true
aws.s3.endpoint=${AWS_S3_ENDPOINT_URL}:${AWS_S3_ENDPOINT_PORT:9000}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:admin}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.bucket=${AWS_S3_BUCKET:products}
aws.s3.url.prefix=${AWS_S3_URL_PREFIX:https://}
aws.s3.url.suffix=${AWS_S3_URL_SUFFIX:.s3.us-east-1.amazonaws.com/}


# ===============================
# Polling
# ===============================
pagbank.polling.interval-ms: ${PAGBANK_POLLING_INTERVAL:180000}
pagbank.polling.lookback-minutes: 60
