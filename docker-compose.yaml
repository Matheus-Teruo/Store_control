services:
  backend:
    container_name: store_control_backend
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file:
      - .env
    ports:
      - 8080:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DATABASE_HOST}:3306/${DATABASE_DB}
    networks:
      - public
      - private
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
  db:
    container_name: store_control_database
    image: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: always
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql
      - ./db/export:/var/lib/mysql-files
      - ./db/scripts:/aux-scripts
    ports:
      - 3306:3306
    networks:
      - private
    environment:
      - MYSQL_DATABASE=${DATABASE_DB}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD_ROOT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u${DATABASE_USER:-dev} -p${DATABASE_PASSWORD:-devSecret} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
  storage:
    container_name: store_control_storage
    image: minio/minio
    restart: always
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${AWS_S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${AWS_S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - public
    volumes:
      - storage-data:/data
  frontend:
    container_name: store_control_frontend
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL}
        VITE_SYSTEM_VERSION: ${VITE_SYSTEM_VERSION}
        VITE_CARD_ID_FIXED: ${VITE_CARD_ID_FIXED}
    env_file:
      - .env
    ports:
      - "5173:5173"
    networks:
      - public
    depends_on:
      backend:
        condition: service_started
  # table_service:
  #   build:
  #     context: ./table_service
  #     dockerfile: dockerfile
  #   container_name: table-service-container
  #   networks:
  #     - private
  #   restart: unless-stopped
  #   volumes:
  #     - ./app:/app
  #   command: python main.py
  proxy:
    container_name: store_control_proxy
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      storage:
        condition: service_started
    networks:
      - public
networks:
  public:
  private:
volumes:
  db-data:
  storage-data:
